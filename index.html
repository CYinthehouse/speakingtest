<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Korean Speaking Test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --retro-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000;
    --neon-blue:#41c0ff;--neon-pink:#ff6b9d;--neon-green:#68d391;--neon-yellow:#ffd700;
    --neon-red:#ff6b6b;--neon-orange:#ff9f43;--neon-purple:#b794f6;
    --card-bg:linear-gradient(180deg,#2a2a4a 0%,#222240 100%);--border-glow:#3a3a5a;
    --ink:#e8e8f5;--ink-soft:#b0b0c8;
    /* ---- type scale ---- */
    /* Press Start 2P track (renders ~25% small, sized up to compensate) */
    --px-hero:1.5rem;--px-h2:1rem;--px-h3:.8rem;--px-btn:.85rem;--px-label:.68rem;--px-micro:.56rem;
    /* Noto Sans / KR content track */
    --t-xl:1.5rem;--t-lg:1.2rem;--t-md:1.05rem;--t-base:1rem;--t-sm:.9rem;
  }
  html{height:100%;height:-webkit-fill-available;}
  body{
    font-family:'Noto Sans','Noto Sans KR',sans-serif;
    background:url('https://cdn.shopify.com/s/files/1/0674/6747/7282/files/sky.png?v=1750990355') repeat;
    background-attachment:fixed;
    min-height:100vh;min-height:100dvh;color:var(--ink);
    padding:18px 14px 80px;line-height:1.6;overflow-x:hidden;
  }
  .wrap{max-width:680px;margin:0 auto;}

  /* ---- badges / title ---- */
  .badge{
    text-align:center;font-family:'Press Start 2P',cursive;font-size:var(--px-label);line-height:1.7;
    color:#fff;background:linear-gradient(135deg,var(--neon-pink),#dd4477);
    border:2px solid rgba(255,255,255,.25);border-radius:10px;
    padding:10px 18px;display:inline-block;text-shadow:var(--retro-shadow);
    box-shadow:0 4px 0 rgba(0,0,0,.4),0 8px 22px rgba(255,107,157,.3);
  }
  .badge-row{text-align:center;margin-bottom:18px;}
  .title-card{
    background:var(--card-bg);border:2px solid var(--border-glow);border-radius:20px;
    box-shadow:0 0 40px rgba(65,192,255,.15);
    padding:30px 22px;text-align:center;position:relative;overflow:hidden;
  }
  .title-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink),var(--neon-yellow));}
  h1{
    font-family:'Press Start 2P',cursive;font-size:var(--px-hero);line-height:1.6;margin:0 0 10px;
    color:#fff;text-shadow:var(--retro-shadow);letter-spacing:1px;
  }
  .sub{font-size:var(--t-sm);color:var(--neon-yellow);font-weight:700;margin-top:6px;font-family:'Noto Sans KR',sans-serif;}

  /* ---- name/date meta ---- */

  /* ---- progress ---- */
  .progress-bar{
    height:14px;background:rgba(0,0,0,.4);border:2px solid var(--border-glow);border-radius:999px;
    margin:18px 0 4px;overflow:hidden;padding:0;
  }
  .progress-fill{
    height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--neon-blue),var(--neon-green));
    box-shadow:0 0 15px rgba(65,192,255,.5);transition:width .45s ease;
  }
  .progress-text{font-family:'Press Start 2P',cursive;font-weight:400;color:var(--neon-yellow);font-size:var(--px-label);text-shadow:var(--retro-shadow);}

  /* ---- section headers ---- */
  .section{margin-top:34px;}
  .part-head{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(135deg,#2a2a4a 0%,#1a1a2e 100%);color:#fff;
    border:2px solid var(--neon-blue);border-radius:16px;padding:14px 18px;
    box-shadow:0 0 25px rgba(65,192,255,.2);margin-bottom:8px;
  }
  .part-head .num{
    background:linear-gradient(135deg,var(--neon-blue),#0099dd);color:#fff;
    font-family:'Press Start 2P',cursive;font-size:var(--px-h3);
    width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    flex:0 0 44px;text-shadow:var(--retro-shadow);
  }
  .part-head h2{margin:0;font-family:'Press Start 2P',cursive;font-size:var(--px-h2);line-height:1.6;text-shadow:var(--retro-shadow);}
  .part-head .pico{margin-left:auto;font-size:var(--t-xl);}
  .head-practice{border-color:var(--neon-green) !important;box-shadow:0 0 25px rgba(104,211,145,.25) !important;}
  .head-practice .num{background:linear-gradient(135deg,var(--neon-green),#38a169) !important;}

  /* ---- instruction / pills ---- */
  .instr{
    font-size:var(--t-base);color:var(--ink);font-weight:500;background:rgba(65,192,255,.1);
    border:2px solid var(--neon-blue);border-radius:14px;padding:14px 16px;margin:12px 0 4px;
    line-height:1.7;
  }
  .instr b{color:var(--neon-yellow);}
  .practice-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Press Start 2P',cursive;font-size:var(--px-label);color:#fff;
    background:linear-gradient(135deg,var(--neon-green),#38a169);
    border:2px solid rgba(255,255,255,.25);border-radius:10px;
    padding:8px 14px;margin-bottom:10px;text-shadow:var(--retro-shadow);box-shadow:0 3px 0 rgba(0,0,0,.4);
  }

  /* ---- start banner ---- */
  .start-banner{
    text-align:center;background:linear-gradient(135deg,var(--neon-pink),#dd4477);
    color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:16px;padding:20px 16px;margin-top:16px;
    box-shadow:0 0 30px rgba(255,107,157,.3);
  }
  .start-banner h2{font-family:'Press Start 2P',cursive;font-size:var(--px-h2);line-height:1.6;margin:0 0 8px;text-shadow:var(--retro-shadow);}
  .start-banner p{margin:0;font-weight:700;font-size:var(--t-base);}

  /* ---- cards ---- */
  .card{
    background:var(--card-bg);border:2px solid var(--border-glow);border-radius:18px;
    padding:26px 18px 18px;margin-top:28px;position:relative;
    box-shadow:0 0 30px rgba(0,0,0,.25);
  }
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:18px 18px 0 0;
    background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink),var(--neon-yellow));}
  .rec-card{border-color:var(--neon-purple);box-shadow:0 0 30px rgba(183,148,246,.2);}
  .qtag{
    position:absolute;top:-12px;left:18px;background:linear-gradient(135deg,var(--neon-pink),#dd4477);color:#fff;
    font-family:'Press Start 2P',cursive;padding:6px 12px;border-radius:8px;
    font-size:var(--px-label);text-shadow:var(--retro-shadow);box-shadow:0 3px 0 rgba(0,0,0,.4);z-index:2;
  }
  .rec-card .qtag{background:linear-gradient(135deg,var(--neon-purple),#7a52cc);}
  .qtext{font-size:var(--t-lg);font-weight:700;margin:6px 0 4px;color:#fff;}
  .qtext .kr{font-family:'Noto Sans KR',sans-serif;font-weight:700;color:var(--neon-yellow);}
  .qtext b{color:var(--neon-yellow);}

  /* ---- MC options ---- */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  @media(max-width:420px){.options{grid-template-columns:1fr;}}
  .opt{
    border:2px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(0,0,0,.3);padding:14px;
    display:flex;align-items:center;gap:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;font-size:var(--t-xl);color:#fff;transition:all .25s ease;user-select:none;
  }
  .opt .letter{
    font-family:'Press Start 2P',cursive;font-size:var(--px-micro);color:#fff;background:linear-gradient(135deg,var(--neon-blue),#0099dd);
    width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    flex:0 0 32px;text-shadow:var(--retro-shadow);
  }
  .opt .krchar{flex:1;}
  .opt:hover{border-color:var(--neon-blue);background:rgba(65,192,255,.1);transform:translateY(-2px);}
  .opt.selected{border-color:var(--neon-blue);background:rgba(65,192,255,.2);box-shadow:0 0 15px rgba(65,192,255,.3);}

  /* ---- character chips ---- */
  .char-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
  .char-chip{
    font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:var(--t-xl);color:#fff;
    background:rgba(0,0,0,.3);border:2px solid var(--neon-blue);
    border-radius:12px;padding:8px 14px;min-width:48px;text-align:center;
  }
  .char-chip:nth-child(3n){border-color:var(--neon-pink);}
  .char-chip:nth-child(3n+1){border-color:var(--neon-green);}

  /* ---- sentence batches ---- */
  .batch-wrap{margin-top:14px;}
  .sent-block{
    background:var(--card-bg);border:2px solid var(--border-glow);border-radius:16px;
    padding:16px;margin-top:14px;
  }
  .sent-block:nth-child(2n){border-color:var(--neon-purple);}
  .say-line{
    background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,107,157,.12));
    border:2px solid var(--neon-yellow);border-radius:12px;
    padding:12px 14px;margin:0 0 12px;font-size:var(--t-lg);font-weight:700;color:#fff;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .say-line b{color:var(--neon-yellow);}
  .say-line .mic{font-size:var(--t-lg);}
  .kw{display:flex;flex-direction:column;gap:7px;}
  .kw-row{
    display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.1);
    border-radius:12px;padding:8px 12px;flex-wrap:wrap;
  }
  .kw-row .kr{
    font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:var(--t-md);color:var(--neon-yellow);
    background:rgba(0,0,0,.3);border:2px solid var(--border-glow);border-radius:8px;padding:3px 10px;
  }
  .kw-row .arrow{color:var(--neon-blue);font-weight:900;}
  .kw-row .en{font-weight:600;color:var(--ink);font-size:var(--t-sm);}

  /* ---- QR cards ---- */
  .qr-gate{text-align:center;}
  .qr-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
  .qr-card{
    background:var(--card-bg);border:2px solid var(--border-glow);border-radius:18px;padding:16px;
    flex:1 1 240px;max-width:280px;box-shadow:0 0 25px rgba(0,0,0,.25);
  }
  .qr-card.c1{border-color:var(--neon-pink);}
  .qr-card.c2{border-color:var(--neon-blue);}
  .qr-card h3{font-family:'Press Start 2P',cursive;font-size:var(--px-h3);line-height:1.6;margin:0 0 8px;text-shadow:var(--retro-shadow);}
  .qr-card.c1 h3{color:var(--neon-pink);}
  .qr-card.c2 h3{color:var(--neon-blue);}
  .qr-card .who{font-size:var(--t-sm);font-weight:700;color:var(--ink-soft);margin-bottom:10px;}
  .qr-card img{width:100%;max-width:210px;height:auto;border-radius:12px;border:3px solid #fff;background:#fff;}
  .qr-note{
    margin-top:16px;background:rgba(104,211,145,.12);border:2px solid var(--neon-green);border-radius:14px;
    padding:12px 14px;font-weight:600;color:var(--ink);font-size:var(--t-base);
  }
  .qr-note b{color:var(--neon-green);}

  /* ---- steps / nav ---- */
  .step{display:none;}
  .step.active{display:block;animation:pop .35s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  .nav{display:flex;gap:12px;margin-top:24px;align-items:center;justify-content:space-between;}
  .btn{
    font-family:'Press Start 2P',cursive;font-size:var(--px-btn);border:none;border-radius:10px;padding:16px 26px;
    cursor:pointer;color:#fff;text-shadow:var(--retro-shadow);
    box-shadow:0 5px 0 rgba(0,0,0,.4);transition:all .2s ease;
  }
  .btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.4);}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4);}
  .btn.next{background:linear-gradient(180deg,var(--neon-blue),#0099dd);}
  .btn.back{background:linear-gradient(180deg,#3a3a5a,#2a2a4a);border:2px solid var(--border-glow);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- finish ---- */
  .finish-card{
    text-align:center;background:var(--card-bg);border:3px solid var(--neon-yellow);border-radius:20px;
    padding:34px 22px;box-shadow:0 0 50px rgba(255,215,0,.2);
  }
  .finish-card .big{font-size:3rem;}
  .finish-card h2{font-family:'Press Start 2P',cursive;color:#fff;font-size:var(--px-h2);line-height:1.6;margin:14px 0;text-shadow:var(--retro-shadow);}
  .finish-card p{color:var(--ink-soft);font-size:var(--t-base);}

  /* ---- print ---- */
  .print-hint{text-align:center;margin-top:30px;}
  .print-btn{
    font-family:'Press Start 2P',cursive;font-size:var(--px-label);background:rgba(0,0,0,.3);color:var(--neon-purple);
    border:2px solid var(--neon-purple);border-radius:10px;padding:12px 18px;cursor:pointer;text-shadow:var(--retro-shadow);
  }
  @media print{
    body{background:#fff;color:#000;padding:0;}
    .nav,.progress-bar,.progress-text,.print-hint,.logout-btn{display:none !important;}
    .step{display:block !important;animation:none;page-break-inside:avoid;}
    .card,.title-card,.qr-card,.part-head,.sent-block{box-shadow:none;}
  }

  /* ---- responsive ---- */
  @media(max-width:520px){
    h1{font-size:1.15rem;}
    .part-head h2{font-size:.78rem;}
    .qtext{font-size:1.05rem;}
  }

  /* ========== LOGIN GATE ========== */
  .gate-overlay{
    position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;
    background:url('https://cdn.shopify.com/s/files/1/0674/6747/7282/files/sky.png?v=1750990355') repeat;
  }
  .gate-card{
    background:var(--card-bg);border:2px solid var(--neon-blue);border-radius:20px;
    box-shadow:0 0 50px rgba(65,192,255,.25);
    padding:34px 24px;max-width:400px;width:100%;text-align:center;position:relative;overflow:hidden;
  }
  .gate-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--neon-blue),var(--neon-pink),var(--neon-yellow));}
  .gate-card h1{font-size:var(--px-h2);margin:0 0 12px;}
  .gate-card .sub{margin-bottom:20px;font-size:var(--t-base);}
  .gate-field{
    background:rgba(0,0,0,.3);border:2px solid var(--border-glow);border-radius:12px;padding:12px 14px;
    display:flex;align-items:center;gap:10px;margin-bottom:12px;text-align:left;
  }
  .gate-field label{font-family:'Press Start 2P',cursive;color:var(--neon-blue);font-size:var(--px-label);white-space:nowrap;text-shadow:var(--retro-shadow);}
  .gate-field input{
    border:none;border-bottom:2px solid var(--border-glow);background:transparent;flex:1;
    font-family:'Noto Sans',sans-serif;font-size:var(--t-base);color:#fff;padding:4px 2px;outline:none;min-width:0;
  }
  .gate-field input:focus{border-bottom-color:var(--neon-blue);}
  .gate-field input::placeholder{color:rgba(255,255,255,.35);}
  .gate-btn{
    font-family:'Press Start 2P',cursive;font-size:var(--px-btn);border:none;border-radius:10px;padding:16px 26px;
    cursor:pointer;color:#fff;text-shadow:var(--retro-shadow);width:100%;margin-top:6px;
    background:linear-gradient(180deg,var(--neon-green),#38a169);
    box-shadow:0 5px 0 rgba(0,0,0,.4);transition:all .2s ease;
  }
  .gate-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.4);}
  .gate-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4);}
  .gate-btn:disabled{opacity:.6;cursor:not-allowed;}
  .gate-err{color:var(--neon-red);font-weight:700;font-size:var(--t-sm);margin-top:12px;min-height:1.2em;}
  #appWrap{display:none;}
  .logout-btn{
    position:fixed;top:10px;right:10px;z-index:50;font-family:'Press Start 2P',cursive;font-size:var(--px-micro);
    background:rgba(0,0,0,.5);color:var(--neon-pink);border:2px solid var(--neon-pink);border-radius:8px;
    padding:8px 12px;cursor:pointer;text-shadow:var(--retro-shadow);
  }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ===== LOGIN GATE ===== -->
<div class="gate-overlay" id="gate">
  <div class="gate-card">
    <h1>Korean Speaking Test</h1>
    <div class="sub">Log in with your KoreanLearnin Teams account to continue.</div>
    <div class="gate-field"><label>Email</label><input type="email" id="gEmail" autocomplete="username" placeholder="your email"></div>
    <div class="gate-field"><label>Password</label><input type="password" id="gPass" autocomplete="current-password" placeholder="your password"></div>
    <button class="gate-btn" id="gBtn">Enter</button>
    <div class="gate-err" id="gErr"></div>
  </div>
</div>

<!-- ===== APP (hidden until login) ===== -->
<div id="appWrap">
<button class="logout-btn" id="logoutBtn">Log out</button>
<div class="wrap">
  <div class="badge-row"><span class="badge">★ 6 Week Absolute Beginner Test ★</span></div>
  <div class="title-card">
    <h1>Easy Korean<br>Speaking Test</h1>
    <div class="sub">한국어 말하기 시험</div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
  <div class="progress-text" id="ptext" style="text-align:center;"></div>

  <!-- content steps injected here from Firestore -->
  <div id="stepHost"></div>

  <div class="nav">
    <button class="btn back" id="backBtn">← Back</button>
    <span class="progress-text" id="counter"></span>
    <button class="btn next" id="nextBtn">Next →</button>
  </div>
  <div class="print-hint">
    <button class="print-btn" onclick="window.print()">🖨 Print this test</button>
  </div>
</div>
</div>

<script>
  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBismf9dfYPRPZdimmhZyqxecQnwSL4O8M",
    authDomain: "koreanlearnin-teams.firebaseapp.com",
    projectId: "koreanlearnin-teams",
    storageBucket: "koreanlearnin-teams.firebasestorage.app",
    messagingSenderId: "437370841898",
    appId: "1:437370841898:web:6c329a30956d4170a60c53"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const gate = document.getElementById('gate');
  const appWrap = document.getElementById('appWrap');
  const gBtn = document.getElementById('gBtn');
  const gErr = document.getElementById('gErr');
  const gEmail = document.getElementById('gEmail');
  const gPass = document.getElementById('gPass');

  let booted = false;

  function showErr(msg){ gErr.textContent = msg; }

  async function doLogin(){
    showErr('');
    const email = gEmail.value.trim();
    const pass = gPass.value;
    if(!email || !pass){ showErr('Please enter your email and password.'); return; }
    gBtn.disabled = true; gBtn.textContent = 'Checking…';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged handles the rest
    } catch(e){
      gBtn.disabled = false; gBtn.textContent = 'Enter';
      const map = {
        'auth/invalid-email':'That email doesn\'t look right.',
        'auth/user-not-found':'No account found with that email.',
        'auth/wrong-password':'Wrong password — try again.',
        'auth/invalid-credential':'Email or password is incorrect.',
        'auth/too-many-requests':'Too many tries. Wait a bit and retry.',
        'auth/network-request-failed':'Network problem — check your connection.'
      };
      showErr(map[e.code] || ('Could not log in: ' + e.code));
    }
  }

  gBtn.onclick = doLogin;
  gPass.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  gEmail.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  document.getElementById('logoutBtn').onclick = ()=> auth.signOut();

  auth.onAuthStateChanged(async user=>{
    if(user){
      gBtn.disabled = false; gBtn.textContent = 'Enter';
      if(!booted){
        try {
          await loadTest();
          booted = true;
        } catch(e){
          showErr('Logged in, but the test failed to load: ' + (e.message||e));
          return;
        }
      }
      gate.style.display = 'none';
      appWrap.style.display = 'block';
    } else {
      appWrap.style.display = 'none';
      gate.style.display = 'flex';
    }
  });

  // ---------- Load test content from Firestore, then build ----------
  async function loadTest(){
    const snap = await db.collection('speakingTests').doc('easy-v1').get();
    if(!snap.exists) throw new Error('test content not found');
    const data = snap.data();
    const steps = data.steps || [];
    const host = document.getElementById('stepHost');
    host.innerHTML = '';
    steps.forEach(st=>{
      const div = document.createElement('div');
      div.className = 'step';
      if(st.shuffle) div.setAttribute('data-shuffle', st.shuffle);
      if(st.label) div.setAttribute('data-label', st.label);
      div.innerHTML = st.html;
      host.appendChild(div);
    });
    initTest();
  }

  // ---------- Original test logic (runs after injection) ----------
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function initTest(){
    // 1) Shuffle MC option order within each MC question + relabel A-D
    document.querySelectorAll('.shuffle-opts').forEach(group=>{
      const opts=Array.from(group.children);
      shuffle(opts);
      const letters=['A','B','C','D'];
      opts.forEach((o,idx)=>{
        o.querySelector('.letter').textContent=letters[idx]||'';
        group.appendChild(o);
      });
    });

    // 2) Shuffle the ORDER of the practice MC question steps among themselves
    const allSteps = Array.from(document.querySelectorAll('.step'));
    const mcSteps = allSteps.filter(s=>s.dataset.shuffle==='mc');
    if(mcSteps.length){
      const anchor = document.querySelector('.step[data-shuffle="practice-speak"]');
      shuffle(mcSteps.slice()).forEach(s=>anchor.parentNode.insertBefore(s, anchor));
    }
    document.querySelectorAll('.mc-tag').forEach((tag,i)=>{ tag.textContent='Practice '+(i+1); });

    // 3) Shuffle character chips within each Part 1 strip
    document.querySelectorAll('.shuffle-chars').forEach(strip=>{
      const chips=Array.from(strip.children);
      shuffle(chips).forEach(c=>strip.appendChild(c));
    });

    // 4) Shuffle sentence blocks within each batch
    document.querySelectorAll('.shuffle-blocks').forEach(wrap=>{
      const blocks=Array.from(wrap.children);
      shuffle(blocks).forEach(b=>wrap.appendChild(b));
    });

    // ---- Navigation ----
    const steps = Array.from(document.querySelectorAll('.step'));
    let cur = 0;
    const bar = document.getElementById('bar');
    const ptext = document.getElementById('ptext');
    const counter = document.getElementById('counter');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');

    function render(){
      steps.forEach((s,i)=>s.classList.toggle('active', i===cur));
      const pct = Math.round(((cur+1)/steps.length)*100);
      bar.style.width = pct + '%';
      ptext.textContent = steps[cur].dataset.label || '';
      counter.textContent = (cur+1) + ' / ' + steps.length;
      backBtn.disabled = cur===0;
      nextBtn.textContent = cur===steps.length-1 ? 'Done' : 'Next →';
      window.scrollTo({top:0,behavior:'smooth'});
    }
    nextBtn.onclick = ()=>{ if(cur<steps.length-1){cur++;render();} };
    backBtn.onclick = ()=>{ if(cur>0){cur--;render();} };

    document.querySelectorAll('.options').forEach(group=>{
      group.querySelectorAll('.opt').forEach(opt=>{
        opt.onclick = ()=>{
          group.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
          opt.classList.add('selected');
        };
      });
    });

    render();
  }
</script>
