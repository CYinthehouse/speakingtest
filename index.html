<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy Korean Speaking Test ☆</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  :root{
    --pink:#ff9bc7;--pink-deep:#ff6fae;--lilac:#c9a7ff;--sky:#a7d8ff;--mint:#b6f0d8;
    --cream:#fff7fb;--butter:#fff3cf;--ink:#5b3a52;--ink-soft:#8a6a82;--line:#ffd6ea;
    --shadow:#ffd0e6;--correct:#7fd6a8;--wrong:#ff9aa8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito','Noto Sans KR',sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffe3f1 0 22%, transparent 22%),
      radial-gradient(circle at 88% 14%, #e6dbff 0 18%, transparent 18%),
      radial-gradient(circle at 78% 88%, #d6f0ff 0 20%, transparent 20%),
      linear-gradient(160deg,#fff7fb 0%, #fdeffa 55%, #f3ecff 100%);
    background-attachment:fixed;color:var(--ink);min-height:100vh;
    padding:18px 14px 80px;line-height:1.55;
  }
  .wrap{max-width:680px;margin:0 auto;}
  .badge{
    text-align:center;font-family:'Gaegu',cursive;font-weight:700;font-size:.95rem;
    color:var(--pink-deep);background:#fff;border:3px dashed var(--pink);border-radius:999px;
    padding:6px 18px;display:inline-block;box-shadow:0 4px 0 var(--shadow);
  }
  .badge-row{text-align:center;margin-bottom:14px;}
  .title-card{
    background:linear-gradient(135deg,#fff 0%, #fff3fa 100%);border:4px solid #fff;border-radius:28px;
    box-shadow:0 10px 0 var(--shadow), 0 14px 30px rgba(255,140,190,.25);
    padding:26px 22px 22px;text-align:center;position:relative;overflow:hidden;
  }
  .title-card::before{content:"♡";position:absolute;top:8px;left:14px;font-size:1.4rem;color:var(--lilac);opacity:.6;}
  .title-card::after{content:"☆";position:absolute;bottom:8px;right:16px;font-size:1.6rem;color:var(--sky);opacity:.7;}
  h1{
    font-family:'Gaegu',cursive;font-weight:700;font-size:2.3rem;margin:0 0 4px;color:var(--pink-deep);
    text-shadow:2px 2px 0 #fff, 4px 4px 0 var(--shadow);letter-spacing:.5px;
  }
  .sub{font-size:.95rem;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  .mascot{font-size:2.2rem;margin-top:6px;}
  .meta{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0 6px;}
  .meta .field{
    flex:1 1 200px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:12px 16px;
    box-shadow:0 5px 0 var(--shadow);display:flex;align-items:center;gap:10px;
  }
  .meta label{font-family:'Gaegu',cursive;font-weight:700;color:var(--pink-deep);font-size:1.1rem;white-space:nowrap;}
  .meta input{
    border:none;border-bottom:2px dotted var(--pink);background:transparent;flex:1;
    font-family:'Nunito',sans-serif;font-size:1rem;color:var(--ink);padding:4px 2px;outline:none;min-width:0;
  }
  .meta input:focus{border-bottom-color:var(--pink-deep);}
  .section{margin-top:30px;}
  .part-head{
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(120deg,var(--pink) 0%, var(--lilac) 100%);color:#fff;
    border-radius:22px;padding:14px 18px;box-shadow:0 7px 0 var(--shadow);margin-bottom:6px;
  }
  .part-head .num{
    background:#fff;color:var(--pink-deep);font-family:'Gaegu',cursive;font-weight:700;
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:1.3rem;flex:0 0 42px;box-shadow:inset 0 -3px 0 var(--shadow);
  }
  .part-head h2{margin:0;font-family:'Gaegu',cursive;font-weight:700;font-size:1.45rem;line-height:1.1;}
  .part-head .pico{margin-left:auto;font-size:1.5rem;}
  .instr{
    font-size:.95rem;color:var(--ink-soft);font-weight:600;background:var(--butter);
    border:2px dashed #ffd87a;border-radius:16px;padding:10px 14px;margin:10px 0 4px;
  }
  .instr b{color:#d98b00;}
  .practice-pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Gaegu',cursive;font-weight:700;font-size:1rem;color:#2f8f5a;
    background:#d8f5e6;border:2px dashed #6bcfa0;border-radius:999px;
    padding:5px 16px;margin-bottom:8px;box-shadow:0 3px 0 #bfe9d3;
  }
  .head-practice{background:linear-gradient(120deg,#6bcfa0,#a7d8ff) !important;}
  .start-banner{
    text-align:center;background:linear-gradient(120deg,#ff9bc7,#ffd87a);
    color:#fff;border-radius:22px;padding:18px 16px;margin-top:16px;
    box-shadow:0 7px 0 var(--shadow);
  }
  .start-banner h2{font-family:'Gaegu',cursive;font-weight:700;font-size:1.6rem;margin:0 0 4px;text-shadow:1px 1px 0 var(--shadow);}
  .start-banner p{margin:0;font-weight:700;font-size:1rem;}
  .card{
    background:#fff;border:3px solid var(--line);border-radius:22px;padding:18px 18px 16px;
    margin-top:16px;box-shadow:0 7px 0 var(--shadow);position:relative;
  }
  .rec-card{border-color:var(--lilac);box-shadow:0 7px 0 #e6dbff;}
  .qtag{
    position:absolute;top:-14px;left:18px;background:var(--pink-deep);color:#fff;
    font-family:'Gaegu',cursive;font-weight:700;padding:3px 14px;border-radius:999px;
    font-size:.95rem;box-shadow:0 3px 0 var(--shadow);
  }
  .rec-card .qtag{background:var(--lilac);box-shadow:0 3px 0 #e6dbff;}
  .qtext{font-size:1.15rem;font-weight:800;margin:8px 0 4px;color:var(--ink);}
  .qtext .kr{font-family:'Noto Sans KR',sans-serif;font-weight:900;}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  @media(max-width:420px){.options{grid-template-columns:1fr;}}
  .opt{
    border:3px solid var(--line);border-radius:16px;background:var(--cream);padding:12px 14px;
    display:flex;align-items:center;gap:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;
    font-weight:700;font-size:1.35rem;transition:transform .08s, box-shadow .12s, background .12s, border-color .12s;user-select:none;
  }
  .opt .letter{
    font-family:'Nunito',sans-serif;font-weight:900;color:var(--pink-deep);background:#fff;
    width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:1rem;flex:0 0 30px;border:2px solid var(--line);
  }
  .opt:hover{transform:translateY(-2px);border-color:var(--pink);}
  .opt.selected{background:linear-gradient(120deg,#ffe6f2,#f3e7ff);border-color:var(--pink-deep);box-shadow:0 4px 0 var(--shadow);}
  .opt.selected .letter{background:var(--pink-deep);color:#fff;border-color:var(--pink-deep);}
  .char-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .char-chip{
    font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:1.5rem;color:var(--ink);
    background:linear-gradient(135deg,#fff 0%, #fff2f9 100%);border:3px solid var(--line);
    border-radius:14px;padding:8px 14px;min-width:48px;text-align:center;box-shadow:0 4px 0 var(--shadow);
  }
  .char-chip:nth-child(3n){border-color:var(--sky);box-shadow:0 4px 0 #cfeaff;}
  .char-chip:nth-child(3n+1){border-color:var(--lilac);box-shadow:0 4px 0 #e6dbff;}
  .batch-wrap{margin-top:14px;}
  .sent-block{
    background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 16px 12px;
    margin-top:14px;box-shadow:0 6px 0 var(--shadow);
  }
  .sent-block:nth-child(2n){border-color:var(--lilac);box-shadow:0 6px 0 #e6dbff;}
  .say-line{
    background:linear-gradient(120deg,#fff4d6,#ffe6f2);border:3px solid #ffd87a;border-radius:16px;
    padding:10px 14px;margin:0 0 10px;font-size:1.1rem;font-weight:800;color:var(--ink);
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .say-line .mic{font-size:1.25rem;}
  .kw{display:flex;flex-direction:column;gap:7px;}
  .kw-row{
    display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--line);
    border-radius:14px;padding:7px 12px;flex-wrap:wrap;
  }
  .kw-row .kr{
    font-family:'Noto Sans KR',sans-serif;font-weight:900;font-size:1.1rem;color:var(--pink-deep);
    background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 10px;
  }
  .kw-row .arrow{color:var(--ink-soft);font-weight:900;}
  .kw-row .en{font-weight:700;color:var(--ink);font-size:.96rem;}
  .nav{display:flex;gap:12px;margin-top:22px;align-items:center;justify-content:space-between;}
  .btn{
    font-family:'Gaegu',cursive;font-weight:700;border:none;border-radius:999px;padding:13px 26px;
    font-size:1.2rem;cursor:pointer;box-shadow:0 5px 0 var(--shadow);
    transition:transform .08s, box-shadow .08s, filter .1s;color:#fff;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow);}
  .btn.next{background:linear-gradient(120deg,var(--pink-deep),var(--lilac));}
  .btn.back{background:#fff;color:var(--pink-deep);border:3px solid var(--line);box-shadow:0 5px 0 var(--shadow);}
  .btn:disabled{filter:grayscale(.5) opacity(.55);cursor:not-allowed;}
  .progress-text{font-family:'Gaegu',cursive;font-weight:700;color:var(--ink-soft);font-size:1.05rem;}
  .progress-bar{
    height:14px;background:#fff;border:3px solid var(--line);border-radius:999px;margin:14px 0 4px;
    overflow:hidden;box-shadow:inset 0 2px 4px rgba(255,170,200,.2);
  }
  .progress-fill{
    height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--pink),var(--lilac),var(--sky));transition:width .35s ease;
  }
  .qr-gate{text-align:center;}
  .qr-cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
  .qr-card{
    background:#fff;border:3px solid var(--line);border-radius:22px;padding:16px;
    box-shadow:0 7px 0 var(--shadow);flex:1 1 240px;max-width:280px;
  }
  .qr-card.c1{border-color:var(--pink);box-shadow:0 7px 0 var(--shadow);}
  .qr-card.c2{border-color:var(--sky);box-shadow:0 7px 0 #cfeaff;}
  .qr-card h3{font-family:'Gaegu',cursive;font-weight:700;font-size:1.3rem;margin:0 0 4px;}
  .qr-card.c1 h3{color:var(--pink-deep);}
  .qr-card.c2 h3{color:#3b9bd6;}
  .qr-card .who{font-size:.92rem;font-weight:700;color:var(--ink-soft);margin-bottom:10px;}
  .qr-card img{width:100%;max-width:210px;height:auto;border-radius:14px;border:3px solid var(--cream);background:#fff;}
  .qr-note{
    margin-top:16px;background:var(--mint);border:2px dashed #6bcfa0;border-radius:16px;
    padding:12px 14px;font-weight:700;color:#2f7d5a;font-size:.95rem;
  }
  .step{display:none;}
  .step.active{display:block;animation:pop .3s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
  .finish-card{text-align:center;background:#fff;border:3px solid var(--line);border-radius:24px;padding:30px 20px;box-shadow:0 8px 0 var(--shadow);}
  .finish-card .big{font-size:3rem;}
  .finish-card h2{font-family:'Gaegu',cursive;color:var(--pink-deep);font-size:1.8rem;margin:6px 0;}
  @media print{
    body{background:#fff;padding:0;}
    .nav,.progress-bar,.progress-text,.print-hint{display:none !important;}
    .step{display:block !important;animation:none;page-break-inside:avoid;}
    .card,.title-card,.qr-card,.part-head,.sent-block{box-shadow:none;}
    .qr-cards{justify-content:flex-start;}
  }
  .print-hint{text-align:center;margin-top:30px;}
  .print-btn{
    font-family:'Gaegu',cursive;font-weight:700;background:#fff;color:var(--lilac);
    border:3px dashed var(--lilac);border-radius:999px;padding:8px 20px;font-size:1rem;cursor:pointer;
  }
</style>

<style>
  .gate-overlay{
    position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    padding:20px;background:
      radial-gradient(circle at 15% 12%, #ffe3f1 0 24%, transparent 24%),
      radial-gradient(circle at 85% 18%, #e6dbff 0 20%, transparent 20%),
      linear-gradient(160deg,#fff7fb 0%, #fdeffa 55%, #f3ecff 100%);
  }
  .gate-card{
    background:linear-gradient(135deg,#fff 0%, #fff3fa 100%);border:4px solid #fff;border-radius:28px;
    box-shadow:0 10px 0 var(--shadow), 0 14px 30px rgba(255,140,190,.25);
    padding:30px 24px;max-width:380px;width:100%;text-align:center;
  }
  .gate-card h1{font-size:1.7rem;margin:0 0 4px;}
  .gate-card .sub{margin-bottom:18px;}
  .gate-field{
    background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px;
    box-shadow:0 4px 0 var(--shadow);display:flex;align-items:center;gap:10px;margin-bottom:12px;text-align:left;
  }
  .gate-field label{font-family:'Gaegu',cursive;font-weight:700;color:var(--pink-deep);font-size:1rem;white-space:nowrap;}
  .gate-field input{
    border:none;border-bottom:2px dotted var(--pink);background:transparent;flex:1;
    font-family:'Nunito',sans-serif;font-size:1rem;color:var(--ink);padding:4px 2px;outline:none;min-width:0;
  }
  .gate-field input:focus{border-bottom-color:var(--pink-deep);}
  .gate-btn{
    font-family:'Gaegu',cursive;font-weight:700;border:none;border-radius:999px;padding:13px 26px;
    font-size:1.2rem;cursor:pointer;box-shadow:0 5px 0 var(--shadow);color:#fff;width:100%;margin-top:4px;
    background:linear-gradient(120deg,var(--pink-deep),var(--lilac));
    transition:transform .08s, box-shadow .08s;
  }
  .gate-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--shadow);}
  .gate-btn:disabled{filter:grayscale(.4) opacity(.6);cursor:not-allowed;}
  .gate-err{color:#d6336c;font-weight:800;font-size:.92rem;margin-top:10px;min-height:1.2em;}
  .gate-mascot{font-size:2rem;margin-bottom:6px;}
  #appWrap{display:none;}
  .gate-foot{font-size:.8rem;color:var(--ink-soft);margin-top:14px;font-weight:700;}
  .logout-btn{
    position:fixed;top:10px;right:10px;z-index:50;font-family:'Gaegu',cursive;font-weight:700;
    background:#fff;color:var(--pink-deep);border:3px solid var(--line);border-radius:999px;
    padding:6px 14px;font-size:.85rem;cursor:pointer;box-shadow:0 3px 0 var(--shadow);
  }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ===== LOGIN GATE ===== -->
<div class="gate-overlay" id="gate">
  <div class="gate-card">
    <div class="gate-mascot">🌸🔐🐣</div>
    <h1>Korean Speaking Test</h1>
    <div class="sub">Log in with your KoreanLearnin account to start ♡</div>
    <div class="gate-field"><label>Email</label><input type="email" id="gEmail" autocomplete="username" placeholder="your email"></div>
    <div class="gate-field"><label>Password</label><input type="password" id="gPass" autocomplete="current-password" placeholder="your password"></div>
    <button class="gate-btn" id="gBtn">Enter ♡</button>
    <div class="gate-err" id="gErr"></div>
    <div class="gate-foot">Same login as your Teams app.</div>
  </div>
</div>

<!-- ===== APP (hidden until login) ===== -->
<div id="appWrap">
<button class="logout-btn" id="logoutBtn">Log out</button>
<div class="wrap">
  <div class="badge-row"><span class="badge">★ 6 Week Absolute Beginner Test ★</span></div>
  <div class="title-card">
    <h1>Easy Korean<br>Speaking Test</h1>
    <div class="sub">한국어 말하기 시험 · You can do it! ٩(ˊᗜˋ*)و</div>
    <div class="mascot">🌸 ☆ 🐣 ☆ 🌸</div>
  </div>
  <div class="meta">
    <div class="field"><label>이름 Name</label><input type="text" placeholder="write your name~"></div>
    <div class="field"><label>날짜 Date</label><input type="text" placeholder="today's date"></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="bar"></div></div>
  <div class="progress-text" id="ptext" style="text-align:center;"></div>

  <!-- content steps injected here from Firestore -->
  <div id="stepHost"></div>

  <div class="nav">
    <button class="btn back" id="backBtn">← Back</button>
    <span class="progress-text" id="counter"></span>
    <button class="btn next" id="nextBtn">Next →</button>
  </div>
  <div class="print-hint">
    <button class="print-btn" onclick="window.print()">🖨 Print this test</button>
  </div>
</div>
</div>

<script>
  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyBismf9dfYPRPZdimmhZyqxecQnwSL4O8M",
    authDomain: "koreanlearnin-teams.firebaseapp.com",
    projectId: "koreanlearnin-teams",
    storageBucket: "koreanlearnin-teams.firebasestorage.app",
    messagingSenderId: "437370841898",
    appId: "1:437370841898:web:6c329a30956d4170a60c53"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const gate = document.getElementById('gate');
  const appWrap = document.getElementById('appWrap');
  const gBtn = document.getElementById('gBtn');
  const gErr = document.getElementById('gErr');
  const gEmail = document.getElementById('gEmail');
  const gPass = document.getElementById('gPass');

  let booted = false;

  function showErr(msg){ gErr.textContent = msg; }

  async function doLogin(){
    showErr('');
    const email = gEmail.value.trim();
    const pass = gPass.value;
    if(!email || !pass){ showErr('Please enter your email and password.'); return; }
    gBtn.disabled = true; gBtn.textContent = 'Checking…';
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged handles the rest
    } catch(e){
      gBtn.disabled = false; gBtn.textContent = 'Enter ♡';
      const map = {
        'auth/invalid-email':'That email doesn\'t look right.',
        'auth/user-not-found':'No account found with that email.',
        'auth/wrong-password':'Wrong password — try again.',
        'auth/invalid-credential':'Email or password is incorrect.',
        'auth/too-many-requests':'Too many tries. Wait a bit and retry.',
        'auth/network-request-failed':'Network problem — check your connection.'
      };
      showErr(map[e.code] || ('Could not log in: ' + e.code));
    }
  }

  gBtn.onclick = doLogin;
  gPass.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  gEmail.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  document.getElementById('logoutBtn').onclick = ()=> auth.signOut();

  auth.onAuthStateChanged(async user=>{
    if(user){
      gBtn.disabled = false; gBtn.textContent = 'Enter ♡';
      if(!booted){
        try {
          await loadTest();
          booted = true;
        } catch(e){
          showErr('Logged in, but the test failed to load: ' + (e.message||e));
          return;
        }
      }
      gate.style.display = 'none';
      appWrap.style.display = 'block';
    } else {
      appWrap.style.display = 'none';
      gate.style.display = 'flex';
    }
  });

  // ---------- Load test content from Firestore, then build ----------
  async function loadTest(){
    const snap = await db.collection('speakingTests').doc('easy-v1').get();
    if(!snap.exists) throw new Error('test content not found');
    const data = snap.data();
    const steps = data.steps || [];
    const host = document.getElementById('stepHost');
    host.innerHTML = '';
    steps.forEach(st=>{
      const div = document.createElement('div');
      div.className = 'step';
      if(st.shuffle) div.setAttribute('data-shuffle', st.shuffle);
      if(st.label) div.setAttribute('data-label', st.label);
      div.innerHTML = st.html;
      host.appendChild(div);
    });
    initTest();
  }

  // ---------- Original test logic (runs after injection) ----------
  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function initTest(){
    // 1) Shuffle MC option order within each MC question + relabel A-D
    document.querySelectorAll('.shuffle-opts').forEach(group=>{
      const opts=Array.from(group.children);
      shuffle(opts);
      const letters=['A','B','C','D'];
      opts.forEach((o,idx)=>{
        o.querySelector('.letter').textContent=letters[idx]||'';
        group.appendChild(o);
      });
    });

    // 2) Shuffle the ORDER of the practice MC question steps among themselves
    const allSteps = Array.from(document.querySelectorAll('.step'));
    const mcSteps = allSteps.filter(s=>s.dataset.shuffle==='mc');
    if(mcSteps.length){
      const anchor = document.querySelector('.step[data-shuffle="practice-speak"]');
      shuffle(mcSteps.slice()).forEach(s=>anchor.parentNode.insertBefore(s, anchor));
    }
    document.querySelectorAll('.mc-tag').forEach((tag,i)=>{ tag.textContent='Practice '+(i+1); });

    // 3) Shuffle character chips within each Part 1 strip
    document.querySelectorAll('.shuffle-chars').forEach(strip=>{
      const chips=Array.from(strip.children);
      shuffle(chips).forEach(c=>strip.appendChild(c));
    });

    // 4) Shuffle sentence blocks within each batch
    document.querySelectorAll('.shuffle-blocks').forEach(wrap=>{
      const blocks=Array.from(wrap.children);
      shuffle(blocks).forEach(b=>wrap.appendChild(b));
    });

    // ---- Navigation ----
    const steps = Array.from(document.querySelectorAll('.step'));
    let cur = 0;
    const bar = document.getElementById('bar');
    const ptext = document.getElementById('ptext');
    const counter = document.getElementById('counter');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');

    function render(){
      steps.forEach((s,i)=>s.classList.toggle('active', i===cur));
      const pct = Math.round(((cur+1)/steps.length)*100);
      bar.style.width = pct + '%';
      ptext.textContent = steps[cur].dataset.label || '';
      counter.textContent = (cur+1) + ' / ' + steps.length;
      backBtn.disabled = cur===0;
      nextBtn.textContent = cur===steps.length-1 ? 'Done ♡' : 'Next →';
      window.scrollTo({top:0,behavior:'smooth'});
    }
    nextBtn.onclick = ()=>{ if(cur<steps.length-1){cur++;render();} };
    backBtn.onclick = ()=>{ if(cur>0){cur--;render();} };

    document.querySelectorAll('.options').forEach(group=>{
      group.querySelectorAll('.opt').forEach(opt=>{
        opt.onclick = ()=>{
          group.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
          opt.classList.add('selected');
        };
      });
    });

    render();
  }
</script>
</body>
</html>
